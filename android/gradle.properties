# High-Performance Gradle Build Optimization
# JVM Heap & Metaspace Allocation
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel Execution & Build Cache
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Android Gradle Plugin & Kotlin Accelerators
android.useAndroidX=true
android.enableR8.fullMode=false
android.nonTransitiveRClass=true
kotlin.incremental=true
