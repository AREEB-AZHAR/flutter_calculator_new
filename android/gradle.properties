# ── Gradle Build Performance Configuration ──────────────────────────────────
# JVM: generous heap + code cache to avoid GC stalls during Kotlin compilation
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m \
  -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8

# ── Core Daemon & Parallelism ─────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true

# ── Build Cache (local on-disk artifact reuse) ───────────────────────────────
org.gradle.caching=true

# ── Configuration Cache ────────────────────────────────────────────────────────
# Disabled: Flutter Gradle Plugin's ReleaseMinSdkCheck task is not currently
# compatible with Gradle Configuration Cache serialization (throws SynchronizedLazyImpl error).
org.gradle.configuration-cache=false

# ── File-System Watching (VFS — avoids rescanning unchanged files) ───────────
org.gradle.vfs.watch=true

# ── Android / AGP Flags ──────────────────────────────────────────────────────
android.useAndroidX=true
# Disable R8 full-mode (prevents slow extra shrinking passes for sideloaded APKs)
android.enableR8.fullMode=false
# Non-transitive R class: each module only sees its own resources → faster compile
android.nonTransitiveRClass=true
# Disable Jetifier (we use AndroidX natively — no legacy Support Library)
android.enableJetifier=false
# Suppress noisy unused resource warnings that slow down resource merging
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings

# ── Kotlin Incremental Compilation ───────────────────────────────────────────
kotlin.incremental=true
# Use the Kotlin daemon for faster repeated compilations
kotlin.daemon.jvm.options=-Xmx4G -XX:+UseG1GC
